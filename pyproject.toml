[project]
name = "code-gen-agent"
version = "0.1.0"
description = "DeepAgent that writes and runs Python in a LangSmith sandbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.7",
    "langchain>=1.3.2",
    "langchain-anthropic>=1.4.4",
    "langgraph-cli[inmem]>=0.4.27",
    "langsmith[sandbox]>=0.8.8",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Only `code_gen_agent` is an importable package. Without this, setuptools'
# flat-layout auto-discovery sees both `assets/` and `code_gen_agent/` at the
# repo root and refuses to build ("Multiple top-level packages discovered").
# `assets/` is still shipped in the deploy image via the build's `ADD . /deps/source`.
[tool.setuptools]
packages = ["code_gen_agent"]
